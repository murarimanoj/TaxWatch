[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regulatory-api"
version = "0.1.0"
description = "Read-only HTTP API for TaxWatch ingestion data"
requires-python = ">=3.11"
dependencies = ["langchain-core>=1,<2", "langchain-openai>=1,<2", "openai>=2,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pymongo>=4.8,<5", "pydantic-settings>=2.4,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6,<1", "black>=24,<27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/regulatory_api"]

[tool.ruff]
line-length = 88
target-version = "py311"
