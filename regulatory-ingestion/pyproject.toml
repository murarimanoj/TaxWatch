[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regulatory-ingestion"
version = "0.1.0"
description = "Batch ingestion pipeline for RBI, CBDT, and SEBI publications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "playwright>=1.55,<2",
  "playwright-stealth>=2,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pymongo>=4.8,<5",
  "pypdf>=5,<6",
  "tenacity>=9,<10",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "respx>=0.21,<1", "ruff>=0.6,<1", "black>=24,<27"]

[project.scripts]
reg-ingest = "regulatory_ingestion.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/regulatory_ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
